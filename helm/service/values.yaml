# Default values for Sammwise.
# Update these values according to your requirements.

sammwise:
  image:
    repository: sjultra/sammwise
    tag: ""                               # defaults to the chart's appVersion; set only to override
    pullPolicy: IfNotPresent
  service:
    nodePort: 30082                       # LAN access: http://<any-node-ip>:30082
  ingress:
    enabled: false                        # true = public at https://<host>; TLS is terminated by nginx on the proxy host
    host: ""                              # required when enabled

  # deployment target(s)
  nodeSelector:
    kubernetes.io/arch: amd64             # the image is amd64-only
  affinity: {}
  tolerations: []
