apiVersion: apps/v1
kind: Deployment
metadata:
  name: sammwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sammwise
  template:
    metadata:
      labels:
        app: sammwise
    spec:
      {{- with .Values.sammwise.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sammwise.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sammwise.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sammwise
          image: "{{ .Values.sammwise.image.repository }}:{{ .Values.sammwise.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.sammwise.image.pullPolicy }}
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sammwise
spec:
  type: NodePort
  selector:
    app: sammwise
  ports:
    - name: http          # LAN access at http://<node-ip>:<nodePort>; public traffic goes nginx → Traefik → Ingress
      protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: {{ .Values.sammwise.service.nodePort }}
{{- if .Values.sammwise.ingress.enabled }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sammwise
  annotations:
    kubernetes.io/ingress.class: "traefik"  # TLS is terminated by nginx on the proxy host, which forwards to Traefik
spec:
  rules:
    - host: {{ required "sammwise.ingress.host is required when sammwise.ingress.enabled is true" .Values.sammwise.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sammwise
                port:
                  number: 80
{{- end }}
